services:
  api:
    build: .
    ports:
      - "8000:8000"

    environment:
      REDIS_URL: redis://redis:6379
      BACKEND_URL: http://backend:9000
      DATABASE_URL: postgresql+asyncpg://rate_limiter:rate_limiter_password@postgres:5432/rate_limiter

      RATE_LIMIT_CAPACITY: 10
      RATE_LIMIT_REFILL_RATE: 1

      IP_RATE_LIMIT_CAPACITY: 10
      IP_RATE_LIMIT_REFILL_RATE: 1

      USER_RATE_LIMIT_CAPACITY: 20
      USER_RATE_LIMIT_REFILL_RATE: 2

      API_KEY_RATE_LIMIT_CAPACITY: 50
      API_KEY_RATE_LIMIT_REFILL_RATE: 5

      SEARCH_IP_RATE_LIMIT_CAPACITY: 5
      SEARCH_IP_RATE_LIMIT_REFILL_RATE: 1

      SEARCH_USER_RATE_LIMIT_CAPACITY: 10
      SEARCH_USER_RATE_LIMIT_REFILL_RATE: 2

      SEARCH_API_KEY_RATE_LIMIT_CAPACITY: 25
      SEARCH_API_KEY_RATE_LIMIT_REFILL_RATE: 5

      UPLOAD_IP_RATE_LIMIT_CAPACITY: 2
      UPLOAD_IP_RATE_LIMIT_REFILL_RATE: 0.5

      UPLOAD_USER_RATE_LIMIT_CAPACITY: 5
      UPLOAD_USER_RATE_LIMIT_REFILL_RATE: 1

      UPLOAD_API_KEY_RATE_LIMIT_CAPACITY: 10
      UPLOAD_API_KEY_RATE_LIMIT_REFILL_RATE: 2
    
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy

  backend:
    build: .
    command:
      [
        "uvicorn",
        "app.backend:app",
        "--host",
        "0.0.0.0",
        "--port",
        "9000"
      ]

    expose:
      - "9000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: rate_limiter
      POSTGRES_PASSWORD: rate_limiter_password
      POSTGRES_DB: rate_limiter

    volumes:
      - postgres_data:/var/lib/postgresql/data

    expose:
      - "5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U rate_limiter -d rate_limiter"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in PowerShell}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
volumes:
  postgres_data:
  prometheus_data:
  grafana_data: