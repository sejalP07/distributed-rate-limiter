services:

  api:
    build: .
    ports:
      - "8000:8000"

    environment:
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_CAPACITY: 10
      RATE_LIMIT_REFILL_RATE: 1

    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5